---
    - name: Initialize scan results
      set_fact:
        all_results: {}

    - name: Get scan start time (WIB)
      shell: TZ='Asia/Jakarta' date +"%Y-%m-%d %H:%M:%S WIB"
      register: rhel9cis_start_time
      changed_when: false

    - set_fact:
        start_time: "{{ rhel9cis_start_time.stdout }}"

    - import_tasks: section-01-scan.yml
      when: section1 | bool
      tags: section01

    - name: Get scan end time (WIB)
      shell: TZ='Asia/Jakarta' date +"%Y-%m-%d %H:%M:%S WIB"
      register: rhel9cis_end_time
      changed_when: false

    - set_fact:
        end_time: "{{ rhel9cis_end_time.stdout }}"

    - name: Ensure report directory exists on target host
      file:
        path: "{{ rhel9cis_report_dir }}"
        state: directory
        mode: '0750'

    - name: Generate CIS scan report on target host
      template:
        src: rhel9-cis-report.html.j2
        dest: "{{ rhel9cis_report_file }}"
        mode: '0640'