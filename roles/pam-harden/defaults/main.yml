---
# Authselect profile that owns /etc/pam.d/{system,password}-auth.
# A custom profile is created from the active stock profile so the PAM stack
# survives authselect updates and can carry extra module options.
pam_authselect_profile_name: hardening
pam_authselect_base_profile: sssd
pam_authselect_force_default_profile: true
pam_authselect_features:
  - with-faillock
  - with-pwhistory

# Password quality - /etc/security/pwquality.conf
pam_pwquality_conf: /etc/security/pwquality.conf
pam_pwquality_settings:
  minlen: 15          # Minimum Length
  minclass: 4         # Minimum Different Categories
  difok: 8            # Minimum Different Characters
  dictcheck: 1        # Prevent Dictionary Words
  maxrepeat: 3        # Maximum Consecutive Repeating Characters
  maxsequence: 3      # Maximum sequential characters
pam_pwquality_enforce_for_root: true

# Password reuse - /etc/security/pwhistory.conf and the pam_pwhistory options
pam_pwhistory_conf: /etc/security/pwhistory.conf
pam_pwhistory_remember: 5
pam_pwhistory_enforce_for_root: true

# Account lockout - /etc/security/faillock.conf
pam_faillock_conf: /etc/security/faillock.conf
pam_faillock_settings:
  deny: 3             # Lock Accounts After Failed Password Attempts
  fail_interval: 900
  unlock_time: 900    # Set Lockout Time for Failed Password Attempts
  dir: /var/run/faillock
pam_faillock_even_deny_root: true
